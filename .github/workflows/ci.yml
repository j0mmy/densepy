name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm test
      - run: node bin/gpy.mjs run examples/densepy/factorial.gpy
      - run: node bin/gpy.mjs --version
      - run: npm run selfhost
      - run: npm run interop
